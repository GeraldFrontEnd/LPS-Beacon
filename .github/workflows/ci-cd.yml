# Automates docs/deploy-steps.txt. Runs on every push to main and only deploys the parts that changed:
#   LPS-Beacon_Backend/lambda-forecastpipeline/**  -> 1 pipeline image + 2 rebuild capacity data
#   LPS-Beacon_Backend/lambda-api/**               -> 3 API lambda
#   LPS-Beacon-Frontend/**                         -> 4 frontend (S3 + CloudFront)
# Order is kept: pipeline -> rebuild -> API -> frontend. "Run workflow" (manual) deploys everything.
# One-time AWS setup (OIDC role, repo variables): see docs/ci-cd-setup.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: AWS login + build everything, but change nothing live"
        type: boolean
        default: true

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write # OIDC login to AWS, no stored access keys
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_PAGER: ""
  PIPELINE_FN: lambda-forecastpipeline
  PIPELINE_REPO: lambda-forecastpipeline
  API_FN: lps-beacon-apilambda
  DATA_BUCKET: lps-beacon-data
  FRONTEND_BUCKET: lps-beacon-frontend
  CF_DISTRIBUTION: E2AFF4J4V920FW

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      pipeline: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.pipeline == 'true' }}
      api: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.api == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          # Only files that actually ship (deploy-steps.txt). Docs, tests and helper scripts do not
          # trigger a deploy or a release.
          filters: |
            pipeline:   # step 1+2: what the Dockerfile copies into the image
              - 'LPS-Beacon_Backend/lambda-forecastpipeline/Dockerfile'
              - 'LPS-Beacon_Backend/lambda-forecastpipeline/.dockerignore'
              - 'LPS-Beacon_Backend/lambda-forecastpipeline/requirements.txt'
              - 'LPS-Beacon_Backend/lambda-forecastpipeline/lambda_function.py'
              - 'LPS-Beacon_Backend/lambda-forecastpipeline/matching_script.py'
              - 'LPS-Beacon_Backend/lambda-forecastpipeline/matching_python_script.py'
              - 'LPS-Beacon_Backend/lambda-forecastpipeline/pipeline/**'
            api:        # step 3: the zip is every .py in lambda-api/ (not tests/)
              - 'LPS-Beacon_Backend/lambda-api/*.py'
            frontend:   # step 4: inputs to "npm run build"
              - 'LPS-Beacon-Frontend/src/**'
              - 'LPS-Beacon-Frontend/public/**'
              - 'LPS-Beacon-Frontend/index.html'
              - 'LPS-Beacon-Frontend/LPSLogo.avif'
              - 'LPS-Beacon-Frontend/package.json'
              - 'LPS-Beacon-Frontend/package-lock.json'
              - 'LPS-Beacon-Frontend/vite.config.ts'
              - 'LPS-Beacon-Frontend/tsconfig*.json'

  # 1 + 2. Pipeline lambda (container image) and rebuild the dashboard / analysis data
  pipeline:
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: LPS-Beacon_Backend/lambda-forecastpipeline
          platforms: linux/amd64
          provenance: false # Lambda rejects multi-manifest images
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.PIPELINE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Dry run - check Lambda access
        if: ${{ inputs.dry_run }}
        run: aws lambda get-function-configuration --function-name "$PIPELINE_FN" --query '{fn:FunctionName,modified:LastModified}'
      - name: Point the function at the new image
        if: ${{ !inputs.dry_run }}
        run: |
          aws lambda update-function-code --function-name "$PIPELINE_FN" \
            --image-uri "${{ steps.ecr.outputs.registry }}/$PIPELINE_REPO:${{ github.sha }}"
          aws lambda wait function-updated --function-name "$PIPELINE_FN"
      - name: Rebuild capacity data (never mode=full)
        if: ${{ !inputs.dry_run }}
        run: |
          aws lambda invoke --function-name "$PIPELINE_FN" \
            --cli-binary-format raw-in-base64-out --cli-read-timeout 900 \
            --payload '{"mode":"capacity_inputs"}' out.json > meta.json
          cat meta.json out.json
          if jq -e 'has("FunctionError")' meta.json >/dev/null; then echo "::error::Pipeline invoke failed"; exit 1; fi
      - name: Check new data shape
        if: ${{ !inputs.dry_run }}
        run: |
          ok=$(aws s3 cp "s3://$DATA_BUCKET/results/capacity/inputs.json" - | jq '.productivity.agencies[0] | has("byMonth")')
          echo "byMonth present: $ok"
          [ "$ok" = "true" ] || { echo "::error::inputs.json is still old-shape"; exit 1; }

  # 3. API lambda (zip). Zips every .py in lambda-api/, so new files are picked up automatically.
  api:
    needs: [changes, pipeline]
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy API
        working-directory: LPS-Beacon_Backend/lambda-api
        run: |
          zip -j api.zip *.py
          unzip -l api.zip
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            aws lambda get-function-configuration --function-name "$API_FN" --query '{fn:FunctionName,modified:LastModified}'
            exit 0
          fi
          aws lambda update-function-code --function-name "$API_FN" --zip-file fileb://api.zip
          aws lambda wait function-updated --function-name "$API_FN"
      # Reminder: new API routes still need adding in API Gateway (9dpaon3lz7) with the JWT authorizer.

  # 4 + 5. Frontend (S3 + CloudFront) and a basic smoke check
  frontend:
    needs: [changes, pipeline, api]
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LPS-Beacon-Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LPS-Beacon-Frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_USE_MOCK: ${{ vars.VITE_USE_MOCK || 'false' }}
          VITE_USE_MOCK_AUTH: ${{ vars.VITE_USE_MOCK_AUTH || 'false' }}
          VITE_USE_SAMPLE_PLAN: ${{ vars.VITE_USE_SAMPLE_PLAN || 'false' }}
          VITE_USE_SAMPLE_REVIEW: ${{ vars.VITE_USE_SAMPLE_REVIEW || 'false' }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload and invalidate
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            aws s3 sync dist "s3://$FRONTEND_BUCKET" --delete --dryrun   # lists what WOULD change
            exit 0
          fi
          aws s3 sync dist "s3://$FRONTEND_BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION" --paths "/*"
      - name: Smoke check
        run: |
          domain=$(aws cloudfront get-distribution --id "$CF_DISTRIBUTION" --query 'Distribution.DomainName' --output text)
          curl -fsS -o /dev/null -w "https://$domain -> %{http_code}\n" "https://$domain/"

  # 6. Release notes. Only after a successful real deploy from a push that changed the pipeline,
  # the API or the frontend. Docs/workflow/other minor changes never create a release.
  # Version bump from commit messages since the last release:
  #   "feat: ..." -> minor (v1.1.0)   "fix: ..." or anything else -> patch (v1.0.1)
  release:
    needs: [changes, pipeline, api, frontend]
    if: >-
      ${{ !failure() && !cancelled() && github.event_name == 'push' && needs.changes.result == 'success' &&
      (needs.changes.outputs.pipeline == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag + GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the changelog
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE: ${{ needs.changes.outputs.pipeline }}
          API: ${{ needs.changes.outputs.api }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          BEFORE: ${{ github.event.before }}
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$last" ]; then range="$last..HEAD"
          elif git cat-file -e "$BEFORE" 2>/dev/null; then range="$BEFORE..HEAD"
          else range="HEAD~1..HEAD"; fi

          subjects=$(git log "$range" --no-merges --pretty=%s)
          [ -n "$subjects" ] || { echo "No new commits since $last; no release."; exit 0; }

          IFS=. read -r major minor patch <<< "${last#v}"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          if [ -z "$last" ]; then major=1; minor=0; patch=0
          elif grep -qiE '^feat(\([^)]*\))?:' <<< "$subjects"; then minor=$((minor+1)); patch=0
          else patch=$((patch+1)); fi
          version="v$major.$minor.$patch"

          {
            echo "## Deployed components"
            [ "$PIPELINE" = "true" ] && echo "- **Pipeline Lambda** (\`lambda-forecastpipeline\`, image \`${GITHUB_SHA::7}\`) + capacity data rebuilt"
            [ "$API" = "true" ]      && echo "- **API Lambda** (\`lps-beacon-apilambda\`)"
            [ "$FRONTEND" = "true" ] && echo "- **Frontend** (S3 + CloudFront)"
            echo
            echo "## Changes"
            git log "$range" --no-merges --pretty='- %s (%h) by %an'
            echo
            if [ -n "$last" ]; then echo "**Full diff:** https://github.com/$GITHUB_REPOSITORY/compare/$last...$version"; fi
          } > notes.md
          cat notes.md

          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --notes-file notes.md --latest
